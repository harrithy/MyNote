<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕的海边骑行</title>
  <style>
    /* 画面随窗口缩放，保留完整的 SVG 构图。 */
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eff4ee; color: #234b4f; font-family: "Microsoft YaHei", system-ui, sans-serif; }
    main { width: min(1100px, 100%); padding: 32px 24px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { font-size: 11px; letter-spacing: .24em; font-weight: 700; margin-bottom: 9px; color: #648580; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); font-weight: 600; letter-spacing: -.04em; }
    .subtitle { margin: 10px 0 0; font-size: 13px; color: #648580; }
    .badge { font-size: 11px; border: 1px solid #c9d9d0; padding: 9px 13px; border-radius: 30px; white-space: nowrap; }
    .scene { overflow: hidden; border-radius: 24px; background: #c9e8e5; box-shadow: 0 20px 65px #345e5012; }
    svg { width: 100%; height: auto; display: block; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 20px; }
    .controls { display: flex; align-items: center; gap: 18px; font-size: 12px; }
    button { border: 0; border-radius: 24px; background: #234b4f; color: #fffdf4; padding: 11px 20px; font: inherit; cursor: pointer; min-width: 98px; }
    button:hover { background: #397075; }
    button:focus-visible, input:focus-visible { outline: 3px solid #e5a843; outline-offset: 4px; }
    label { display: flex; align-items: center; gap: 10px; }
    input { width: 100px; accent-color: #397075; }
    .note { font-size: 11px; color: #76928c; letter-spacing: .04em; }
    @media (max-width: 580px) { main { padding: 24px 14px; } .badge, .note { display: none; } .controls { gap: 12px; } .scene { border-radius: 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">LITTLE JOURNEYS / 01</div><h1>鹈鹕的海边骑行</h1><p class="subtitle">海风刚好，慢慢骑就好。</p></div>
      <span class="badge">SVG · 2D 动画</span>
    </header>
    <div class="scene">
      <!-- 所有角色、车架和风景均由 SVG 矢量图形绘制，无外部素材。 -->
      <svg id="scene" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">鹈鹕骑自行车的海边动画</title>
        <desc id="svgDesc">戴着珊瑚红围巾的白色鹈鹕骑着绿色自行车，车轮和脚踏持续旋转，云朵与路面向后移动。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#c5e8e5"/><stop offset="1" stop-color="#e9f2df"/></linearGradient>
          <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#83c5c2"/><stop offset="1" stop-color="#b4dcd0"/></linearGradient>
          <linearGradient id="beak" x2="0" y2="1"><stop stop-color="#f6cb64"/><stop offset="1" stop-color="#e9a743"/></linearGradient>
          <pattern id="roadMarks" width="220" height="8" patternUnits="userSpaceOnUse"><path d="M20 4H100" stroke="#fff8df" stroke-width="4" stroke-linecap="round"/></pattern>
          <g id="cloud" fill="#fffdf2"><path d="M0 27C0 17 10 12 20 15C23-4 52-5 59 13C73 7 89 15 88 27Z"/></g>
          <g id="spokes" stroke="#8ba6a0" stroke-width="1.6"><path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44M-57-24L57 24M-24-57L24 57M-57 24L57-24M-24 57L24-57"/></g>
          <g id="wheel"><circle r="69" fill="#f4edcf" stroke="#29494d" stroke-width="10"/><circle r="61" fill="#d9e8d9" stroke="#c1d0bd" stroke-width="2"/><use href="#spokes"/><circle r="7" fill="#29494d"/><circle r="2.5" fill="#f8f2df"/></g>
          <g id="grass" stroke="#819b6e" stroke-width="3" stroke-linecap="round"><path d="M0 0L-4-16M0 0L9-22M0 0L15-10"/></g>
        </defs>
        <path fill="url(#sky)" d="M0 0H1000V620H0Z"/>
        <circle cx="782" cy="112" r="47" fill="#f9dd91"/>
        <circle cx="782" cy="112" r="62" fill="#f9dd91" opacity=".17"/>
        <g id="clouds" opacity=".8"><use href="#cloud" x="125" y="108"/><use href="#cloud" x="460" y="63" transform="translate(-92 -12) scale(1.2)"/><use href="#cloud" x="880" y="178"/></g>
        <path d="M0 291Q123 274 220 292T447 286T708 290T1000 275V448H0Z" fill="url(#sea)"/>
        <path d="M0 325Q120 310 235 324T470 324T700 318T1000 322M0 370Q150 355 295 369T580 367T1000 365" fill="none" stroke="#d9eece" stroke-width="3" opacity=".5"/>
        <g fill="none" stroke="#619999" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M690 228q9-12 19 0q9-12 19 0M733 203q6-8 13 0q6-8 13 0"/></g>
        <path d="M0 408Q220 390 406 415T1000 395V620H0Z" fill="#e6ddba"/>
        <path d="M0 439Q240 423 470 444T1000 429V620H0Z" fill="#d8cfaa"/>
        <path d="M0 467H1000V572H0Z" fill="#b6bdab"/>
        <path d="M0 467H1000M0 572H1000" stroke="#f8edcb" stroke-width="5"/>
        <rect x="0" y="543" width="1000" height="8" fill="url(#roadMarks)"/>
        <g id="plants"><use href="#grass" x="88" y="447"/><use href="#grass" x="855" y="438"/><use href="#grass" x="437" y="597"/><use href="#grass" x="951" y="605"/></g>
        <ellipse id="shadow" cx="497" cy="516" rx="205" ry="14" fill="#647d71" opacity=".19"/>
        <!-- 自行车保持轮轴位置固定，车轮围绕各自轮轴转动。 -->
        <g id="bicycle">
          <g transform="translate(345 440)"><g id="rearWheel"><use href="#wheel"/></g></g>
          <g transform="translate(643 440)"><g id="frontWheel"><use href="#wheel"/></g></g>
          <path d="M345 440L432 327L486 440Z M432 327H580L486 440 M580 327L643 440" fill="none" stroke="#2a7979" stroke-width="11" stroke-linejoin="round"/>
          <path d="M432 327L421 302M580 327L565 285L585 263H618" fill="none" stroke="#2e5053" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M606 262H624" stroke="#cc765a" stroke-width="10" stroke-linecap="round"/>
          <path d="M398 300Q420 293 446 300" fill="none" stroke="#2a494d" stroke-width="13" stroke-linecap="round"/>
          <path d="M580 292Q613 309 621 349" fill="none" stroke="#47655f" stroke-width="2"/>
          <path d="M314 352H390L411 402M313 352L337 415" fill="none" stroke="#52716b" stroke-width="4" stroke-linecap="round"/>
          <path d="M308 367Q345 331 384 367M610 367Q644 335 677 368" fill="none" stroke="#e5b755" stroke-width="6" stroke-linecap="round"/>
          <path d="M345 440H486" stroke="#426b66" stroke-width="5"/>
          <circle cx="486" cy="440" r="18" fill="#edf0d9" stroke="#365e5c" stroke-width="4"/>
          <g id="crank"><path d="M-25 0H25" stroke="#355b59" stroke-width="5" stroke-linecap="round"/></g>
        </g>
        <!-- 远侧腿先绘制，再叠加身体和近侧腿，形成清晰的前后关系。 -->
        <path id="farLeg" d="M448 313L480 365L461 440" fill="none" stroke="#cb953f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="farFoot" fill="#d79d42"/>
        <g id="bird">
          <path d="M412 270L356 280L382 251L348 247L393 225" fill="#e9eddb" stroke="#345459" stroke-width="3" stroke-linejoin="round"/>
          <path d="M398 212C381 239 382 278 408 302C432 321 468 316 489 291C513 263 502 244 519 212C529 190 548 175 552 150C557 120 539 103 519 105C496 107 486 128 488 150C489 174 469 188 449 190C428 190 407 192 398 212Z" fill="#fffdf0" stroke="#345459" stroke-width="3.5"/>
          <path d="M402 255Q424 294 468 286Q453 310 423 301Q395 287 402 255" fill="#dfe8d7"/>
          <path d="M418 218C434 208 464 217 473 234C481 251 468 272 443 279C433 280 423 273 416 263C435 266 454 252 457 244C438 245 421 235 418 218Z" fill="#e5ecdd" stroke="#748c7f" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M447 252Q470 273 506 267L607 262" fill="none" stroke="#fffdf0" stroke-width="18" stroke-linecap="round"/>
          <path d="M457 259Q480 281 508 275L607 270" fill="none" stroke="#748c7f" stroke-width="2" stroke-linecap="round"/>
          <path d="M596 261L611 259Q621 260 616 266L603 270" fill="#fbfbeb" stroke="#345459" stroke-width="2"/>
          <!-- 大嘴与下方喉囊是鹈鹕的主要辨识特征。 -->
          <path d="M542 145L708 165Q702 205 640 215Q586 220 544 165Z" fill="url(#beak)" stroke="#a97b35" stroke-width="2.5"/>
          <path d="M542 142L712 157Q724 161 712 166L543 163Z" fill="#f9d978" stroke="#a97b35" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M557 174Q604 210 655 198" fill="none" stroke="#fce3a2" stroke-width="4" stroke-linecap="round"/>
          <circle cx="532" cy="133" r="6" fill="#29494d"/><circle cx="534" cy="131" r="1.8" fill="#fff"/>
          <path d="M519 115Q530 109 538 115" fill="none" stroke="#72877a" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M489 184Q508 195 522 186L518 201Q499 210 480 197Z" fill="#d9755c"/>
          <path id="scarf" d="M486 196Q447 199 424 173L414 188Q446 218 490 207Z" fill="#d9755c" stroke="#be604f" stroke-width="2"/>
          <path d="M487 194L495 205L484 212L477 202Z" fill="#eb9473"/>
        </g>
        <path id="nearLeg" d="M439 308L478 367L511 440" fill="none" stroke="#edb449" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="nearFoot" fill="#efb54b" stroke="#bc893b" stroke-width="1.5"/>
        <g id="pedals" stroke="#304f50" stroke-width="5" stroke-linecap="round"><path id="nearPedal"/><path id="farPedal"/></g>
        <g fill="#516c60" font-family="system-ui, sans-serif" font-size="10" letter-spacing="3"><text x="38" y="588">THE COASTAL COMMUTE</text><text x="902" y="588">01 / ∞</text></g>
      </svg>
    </div>
    <footer>
      <div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停动画</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"/><output id="speedValue" for="speed">1.0×</output></label></div>
      <span class="note">一只鹈鹕，一段不着急的旅程。</span>
    </footer>
  </main>
  <script>
    // 使用同一个时间轴驱动车轮、脚踏、角色和风景，暂停后从原位置继续。
    const el = id => document.getElementById(id);
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = motionPreference.matches;
    let speed = 1;
    let time = 0;
    let lastTimestamp;
    const tau = Math.PI * 2;

    // 两段腿的逆向运动学：脚固定在旋转的脚踏上，膝盖朝前自然弯曲。
    function drawLeg(legId, footId, pedalId, hip, phase) {
      const foot = { x: 486 + 25 * Math.cos(phase), y: 440 + 25 * Math.sin(phase) };
      const dx = foot.x - hip.x;
      const dy = foot.y - hip.y;
      const distance = Math.hypot(dx, dy);
      const length = 83;
      const bend = Math.sqrt(Math.max(0, length * length - distance * distance / 4));
      const knee = { x: (hip.x + foot.x) / 2 + dy / distance * bend, y: (hip.y + foot.y) / 2 - dx / distance * bend };
      el(legId).setAttribute('d', `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y - 5}`);
      el(footId).setAttribute('d', `M${foot.x - 6} ${foot.y - 10}Q${foot.x + 5} ${foot.y - 8} ${foot.x + 19} ${foot.y - 3}L${foot.x + 13} ${foot.y + 2}H${foot.x - 9}Z`);
      el(pedalId).setAttribute('d', `M${foot.x - 11} ${foot.y + 3}H${foot.x + 13}`);
    }

    function render() {
      const phase = time * tau * 0.8;
      const bob = Math.sin(phase * 2) * 2;
      const degrees = phase * 180 / Math.PI;
      el('frontWheel').setAttribute('transform', `rotate(${degrees * 1.6})`);
      el('rearWheel').setAttribute('transform', `rotate(${degrees * 1.6})`);
      el('crank').setAttribute('transform', `translate(486 440) rotate(${degrees})`);
      el('bird').setAttribute('transform', `translate(0 ${bob})`);
      el('scarf').setAttribute('transform', `rotate(${Math.sin(phase * 2 + 1) * 4} 486 201)`);
      drawLeg('farLeg', 'farFoot', 'farPedal', { x: 448, y: 307 + bob }, phase + Math.PI);
      drawLeg('nearLeg', 'nearFoot', 'nearPedal', { x: 439, y: 308 + bob }, phase);
      el('roadMarks').setAttribute('patternTransform', `translate(${-time * 95 % 220} 0)`);
      el('shadow').setAttribute('rx', 205 + bob * 2);
      // 云朵和草丛离开左侧后从右侧重入，形成无缝循环。
      const cloudStarts = [125, 460, 880];
      [...el('clouds').children].forEach((cloud, i) => {
        const offset = ((cloudStarts[i] + 160 - time * (9 + i * 2)) % 1320 + 1320) % 1320 - 160;
        cloud.setAttribute('transform', `translate(${offset - cloudStarts[i]} 0)`);
      });
      const plantStarts = [88, 855, 437, 951];
      [...el('plants').children].forEach((plant, i) => {
        const offset = ((plantStarts[i] + 30 - time * 95) % 1060 + 1060) % 1060 - 30;
        plant.setAttribute('transform', `translate(${offset - plantStarts[i]} 0)`);
      });
    }

    function updateButton() {
      el('toggle').textContent = paused ? '播放动画' : '暂停动画';
      el('toggle').setAttribute('aria-pressed', String(paused));
    }
    el('toggle').addEventListener('click', () => { paused = !paused; updateButton(); });
    el('speed').addEventListener('input', event => {
      speed = Number(event.target.value);
      el('speedValue').value = `${speed.toFixed(1)}×`;
    });
    // 尊重系统减少动态效果设置；用户仍可手动播放。
    motionPreference.addEventListener('change', event => { paused = event.matches; updateButton(); });
    document.addEventListener('visibilitychange', () => { lastTimestamp = undefined; });
    function tick(timestamp) {
      if (lastTimestamp !== undefined && !paused) time += Math.min((timestamp - lastTimestamp) / 1000, 0.05) * speed;
      lastTimestamp = timestamp;
      render();
      requestAnimationFrame(tick);
    }
    updateButton();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
